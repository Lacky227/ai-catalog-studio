<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalog Studio · Магазин</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#1b2332;font:15px system-ui,sans-serif}header{background:#fff;border-bottom:1px solid #e1e5eb;padding:22px max(22px,calc((100% - 1160px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}header b{font-size:22px}header span{color:#687487;font-size:12px}main{max-width:1200px;margin:auto;padding:24px 20px}.hero{background:#172e3e;color:white;padding:30px;border-radius:16px;margin:0 0 20px}.hero h1{margin:4px 0;font-size:35px}.hero p{color:#cbd9e2}.layout{display:grid;grid-template-columns:220px 1fr;gap:20px}aside{background:white;border:1px solid #e0e4eb;border-radius:12px;padding:15px;align-self:start}aside h3{font-size:14px;text-transform:uppercase;color:#667085;margin:0 0 14px}button{font:inherit;cursor:pointer;border:0;border-radius:7px;padding:9px 12px;background:#edf1f4;color:#203447}aside button{display:block;width:100%;text-align:left;margin:4px 0;background:white}aside button:hover,aside .selected{background:#e4eef3}aside strong{display:block;margin:12px 0 5px}input{width:100%;border:1px solid #d1d8e0;border-radius:8px;padding:12px;font:inherit;margin-bottom:15px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px}.card{background:#fff;border:1px solid #e0e4eb;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}.cover{background:#eef2f4;color:#6c8290;border-radius:9px;display:grid;place-items:center;height:105px;font-size:13px;letter-spacing:2px}.card h3{font-size:16px;margin:0}.category{color:#758393;font-size:12px}.price{font-size:22px;font-weight:750}.card p{font-size:13px;color:#596778;line-height:1.5;margin:0;flex:1}.primary{background:#173c51;color:#fff}dialog{border:0;border-radius:15px;width:min(680px,94vw);max-height:90vh;padding:25px;overflow:auto;box-shadow:0 15px 80px #0004}dialog::backdrop{background:#12233477}dialog h2{margin:0 0 10px}dialog p,dialog li{line-height:1.6}dl{display:grid;grid-template-columns:1fr 1fr;gap:5px 15px;background:#f1f4f7;padding:12px;border-radius:9px}dd{margin:0}.notice{background:#edf2f5;padding:12px;border-radius:9px;font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:#64748b}@media(max-width:650px){.layout{grid-template-columns:1fr}.hero h1{font-size:27px}aside button{display:inline-block;width:auto}aside strong{display:inline-block}header{padding:18px}.cards{grid-template-columns:1fr}}
</style></head><body><header><b>CATALOG / STUDIO</b><span>Демонстраційна вітрина · AI-контент</span></header><main><div class="hero"><small>SMART CATALOG</small><h1>Знайдіть потрібний товар</h1><p>Категорії та описи сформовані за допомогою штучного інтелекту.</p></div><div class="layout"><aside><h3>Каталог</h3><nav id="nav"></nav></aside><section><input id="search" placeholder="Пошук за назвою…" aria-label="Пошук"><p id="count" class="muted"></p><div class="cards" id="cards"></div></section></div></main><dialog id="detail"><div class="top"><span class="category" id="crumb"></span><button id="close">Закрити ✕</button></div><div id="body"></div></dialog><script>
const $=id=>document.getElementById(id);let data={categories:[],products:[]},filter=[];const el=(tag,text,cls)=>{let x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x};const money=n=>new Intl.NumberFormat('uk-UA',{style:'currency',currency:'UAH'}).format(n);
function setFilter(l1,l2){filter=l1?[l1,l2]:[];render()}
function navButton(label,l1,l2){const b=el('button',label);if(filter[0]===l1&&filter[1]===l2)b.className='selected';b.onclick=()=>setFilter(l1,l2);return b}
function render(){const nav=$('nav');nav.replaceChildren(navButton('Усі товари'));for(const c of data.categories){let top=navButton(c.l1,c.l1);top.style.fontWeight='700';nav.append(top);for(const sub of c.l2)nav.append(navButton('↳ '+sub,c.l1,sub))}let products=data.products.filter(p=>(!filter.length||p.content.l1===filter[0]&&(!filter[1]||p.content.l2===filter[1]))&&(p.content.title+' '+p.name+' '+p.sku).toLowerCase().includes($('search').value.toLowerCase()));$('count').textContent=`Товарів: ${products.length}`;$('cards').replaceChildren();if(!products.length)$('cards').append(el('p',data.products.length?'Нічого не знайдено.':'Каталог поки порожній. Опублікуйте картки з адмінки.'));for(const p of products){const c=p.content,card=el('article',undefined,'card');card.append(el('div','PRODUCT / '+p.sku,'cover'),el('div',c.l1+' / '+c.l2,'category'),el('h3',c.title),el('p',c.short_description),el('div',money(p.price),'price'));let b=el('button','Детальніше','primary');b.onclick=()=>detail(p);card.append(b);$('cards').append(card)}}
function detail(p){let c=p.content,b=$('body');$('crumb').textContent=c.l1+' / '+c.l2;b.replaceChildren(el('h2',c.title),el('div',money(p.price),'price'),el('p',c.description),el('h3','Характеристики'));let dl=el('dl');for(const [k,v] of Object.entries(p.attributes))dl.append(el('dt',k),el('dd',v));b.append(dl);if(c.benefits.length){b.append(el('h3','Особливості'));let ul=el('ul');c.benefits.forEach(x=>ul.append(el('li',x)));b.append(ul)}if(c.faq.length){b.append(el('h3','Запитання та відповіді'));for(let f of c.faq)b.append(el('strong',f.question),el('p',f.answer))}if(c.example_reviews.length){b.append(el('h3','Демонстраційні AI-тексти'),el('p','Це умовні приклади, згенеровані ШІ, а не відгуки реальних покупців.','notice'));for(let r of c.example_reviews)b.append(el('p',r))}$('detail').showModal()}
$('close').onclick=()=>$('detail').close();$('search').oninput=render;fetch('./catalog.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Помилка каталогу');return r.json()}).then(d=>{data=d;render()}).catch(e=>$('count').textContent=e.message);
</script></body></html>
